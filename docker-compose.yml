# Run the backend locally:  docker compose up --build
# Then start the frontend (npm run dev) on http://localhost:5173; it proxies /api and /ws to :8080.
services:
  backend:
    build: .
    image: syncwatch-backend
    ports:
      - "8080:8080"
    environment:
      # optional external catalog integration is off by default
      REZKA_SERVICE_ENABLED: "false"
      REZKA_FEATURE_ENABLED: "false"
      JAVA_OPTS: "-Xmx512m"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped
