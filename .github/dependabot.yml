version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # the image must stay on the Java version of the Gradle toolchain (21);
      # change the toolchain, CI and Dockerfile together to move to a newer Java
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
